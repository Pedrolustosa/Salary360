<div class="space-y-3">
  <div class="flex flex-wrap items-end gap-3">
    <div class="w-44">
      <label class="field-label" for="siFrom">{{ 'salaryIntelligence.filters.from' | translate }}</label>
      <app-month-year-picker inputId="siFrom" [ngModel]="fromValue()" (ngModelChange)="onFromChange($event)" />
    </div>
    <div class="w-44">
      <label class="field-label" for="siTo">{{ 'salaryIntelligence.filters.to' | translate }}</label>
      <app-month-year-picker inputId="siTo" [ngModel]="toValue()" (ngModelChange)="onToChange($event)" />
    </div>

    <div class="inline-flex rounded-lg border border-slate-300 p-0.5 dark:border-slate-600" role="group" [attr.aria-label]="'salaryIntelligence.basis.label' | translate">
      <button
        type="button"
        class="rounded-md px-3 py-1.5 text-sm font-medium transition"
        [class.bg-brand-600]="basis() === SalaryBasis.Net"
        [class.text-white]="basis() === SalaryBasis.Net"
        [class.text-slate-600]="basis() !== SalaryBasis.Net"
        (click)="setBasis(SalaryBasis.Net)"
      >{{ 'salaryIntelligence.basis.net' | translate }}</button>
      <button
        type="button"
        class="rounded-md px-3 py-1.5 text-sm font-medium transition"
        [class.bg-brand-600]="basis() === SalaryBasis.Gross"
        [class.text-white]="basis() === SalaryBasis.Gross"
        [class.text-slate-600]="basis() !== SalaryBasis.Gross"
        (click)="setBasis(SalaryBasis.Gross)"
      >{{ 'salaryIntelligence.basis.gross' | translate }}</button>
    </div>

    <div class="flex flex-wrap gap-2">
      <button type="button" class="btn-secondary px-3 py-1.5 text-xs" (click)="applyLast12()">
        {{ 'salaryIntelligence.shortcuts.last12' | translate }}
      </button>
      <button type="button" class="btn-secondary px-3 py-1.5 text-xs" (click)="applyCurrentYear()">
        {{ 'salaryIntelligence.shortcuts.currentYear' | translate }}
      </button>
      <button type="button" class="btn-secondary px-3 py-1.5 text-xs" (click)="applyAll()">
        {{ 'salaryIntelligence.shortcuts.all' | translate }}
      </button>
    </div>
  </div>

  @if (filterError(); as error) {
    <p class="field-error">{{ 'errors.fields.' + error | translate }}</p>
  }
</div>
