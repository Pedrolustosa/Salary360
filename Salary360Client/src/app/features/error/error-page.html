<main class="mx-auto flex min-h-screen max-w-lg flex-col justify-center px-4">
  <div class="mb-4 flex justify-end"><app-toolbar /></div>
  <section class="card text-center" role="alert">
    <span class="error-icon" [class.error-icon-warn]="code() === '500' || code() === 'generic'">
      <app-icon [name]="icon()" [strokeWidth]="1.5" />
    </span>
    <p class="mt-4 text-5xl font-extrabold tracking-tight text-brand-700 dark:text-brand-500">{{ code() === 'generic' ? '!' : code() }}</p>
    <h1 class="mt-2 text-xl font-bold">{{ 'errorPage.' + code() + '.title' | translate }}</h1>
    <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">{{ 'errorPage.' + code() + '.text' | translate }}</p>

    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <a [routerLink]="homeLink()" class="btn-primary gap-2">
        <app-icon name="home" />
        {{ 'errorPage.goHome' | translate }}
      </a>
      <button type="button" class="btn-secondary gap-2" (click)="back()">
        <app-icon name="arrow-left" />
        {{ 'errorPage.goBack' | translate }}
      </button>
      @if (code() === '500' || code() === 'generic') {
        <button type="button" class="btn-secondary gap-2" (click)="reload()">
          <app-icon name="arrow-path" />
          {{ 'errorPage.retry' | translate }}
        </button>
      }
    </div>
  </section>
</main>
