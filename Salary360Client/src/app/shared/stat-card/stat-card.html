<div class="relative h-full overflow-hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-br to-transparent" [class]="classes().glow"></div>

  <div class="relative flex items-center gap-4">
    <span class="stat-icon flex shrink-0 items-center justify-center rounded-xl" [class]="classes().icon">
      <app-icon [name]="icon()" />
    </span>
    <div class="min-w-0">
      <p class="truncate text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">{{ label() }}</p>
      <p class="text-3xl font-bold leading-tight" [class]="classes().value">{{ value() }}</p>
    </div>
  </div>

  @if (percent() !== null) {
    <div class="relative mt-3">
      <div class="h-1.5 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800">
        <div class="h-full rounded-full transition-all" [class]="classes().bar" [style.width]="width()"></div>
      </div>
      @if (hint()) {
        <p class="mt-1 text-xs text-slate-400">{{ hint() }}</p>
      }
    </div>
  }
</div>
