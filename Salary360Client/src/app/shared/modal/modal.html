@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="presentation">
    <button type="button" class="absolute inset-0 bg-slate-900/50" [attr.aria-label]="'common.cancel' | translate" (click)="requestClose()"></button>
    <div
      #panel
      class="relative flex max-h-[90vh] w-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl dark:border-slate-700 dark:bg-slate-900"
      [class]="maxWidthClass()"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-label]="title()"
    >
      <div class="flex items-center justify-between gap-3 border-b border-slate-200 px-5 py-4 dark:border-slate-700">
        <h2 class="text-base font-semibold text-slate-800 dark:text-slate-100">{{ title() }}</h2>
        <button type="button" class="btn-secondary px-2 py-1" [attr.aria-label]="'common.cancel' | translate" (click)="requestClose()">
          <app-icon name="x-mark" />
        </button>
      </div>
      <div class="overflow-y-auto px-5 py-4">
        <ng-content />
      </div>
    </div>
  </div>
}
