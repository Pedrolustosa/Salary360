<div class="space-y-2" [class]="className()">
  @for (item of items(); track item) {
    <div
      class="h-3 animate-pulse rounded bg-slate-200 dark:bg-slate-700"
      [class.w-full]="item % 3 === 0"
      [class.w-5/6]="item % 3 === 1"
      [class.w-2/3]="item % 3 === 2"
    ></div>
  }
</div>
