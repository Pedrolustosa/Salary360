@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="presentation">
    <button type="button" class="absolute inset-0 bg-slate-900/50" [attr.aria-label]="'common.cancel' | translate" (click)="cancel()"></button>
    <div class="relative w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-5 shadow-xl dark:border-slate-700 dark:bg-slate-900" role="dialog" aria-modal="true" [attr.aria-label]="title()">
      <h2 class="text-base font-semibold text-slate-800 dark:text-slate-100">{{ title() }}</h2>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">{{ message() }}</p>
      <div class="mt-5 flex justify-end gap-2">
        <button type="button" class="btn-secondary" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
        <button type="button" class="btn-primary bg-rose-600 hover:bg-rose-700" (click)="confirm()">{{ confirmLabel() }}</button>
      </div>
    </div>
  </div>
}
