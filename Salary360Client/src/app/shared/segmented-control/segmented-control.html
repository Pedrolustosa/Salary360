<div
  class="inline-flex rounded-xl border border-slate-200 bg-slate-100 p-1 dark:border-slate-700 dark:bg-slate-800"
  role="radiogroup"
  [attr.aria-label]="ariaLabel() || null"
  (keydown)="onKeydown($event)"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="radio"
      class="rounded-lg px-3 py-1.5 text-sm font-medium transition"
      [class.bg-white]="value() === option.value"
      [class.text-slate-900]="value() === option.value"
      [class.shadow-sm]="value() === option.value"
      [class.dark:bg-slate-900]="value() === option.value"
      [class.dark:text-white]="value() === option.value"
      [class.text-slate-500]="value() !== option.value"
      [class.dark:text-slate-400]="value() !== option.value"
      [attr.aria-checked]="value() === option.value"
      [disabled]="disabled()"
      (click)="select(option)"
    >
      {{ option.labelKey | translate }}
    </button>
  }
</div>
