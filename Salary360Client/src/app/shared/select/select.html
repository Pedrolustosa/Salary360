<div class="relative">
  <button
    type="button"
    class="field flex items-center justify-between gap-2 text-left"
    [class.py-1!]="compact()"
    [id]="inputId()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() || null"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span class="flex min-w-0 items-center gap-2">
      @if (selected(); as current) {
        @if (current.flagUrl) {
          <span class="select-flag" [style.background-image]="current.flagUrl"></span>
        }
        <span class="truncate">{{ current.label }}</span>
      } @else {
        <span class="truncate text-slate-400 dark:text-slate-500">{{ placeholder() }}</span>
      }
    </span>
    <app-icon name="chevron-down" class="shrink-0 text-slate-400" />
  </button>

  @if (open()) {
    <div class="absolute left-0 top-full z-40 mt-1 w-full min-w-48 rounded-xl border border-slate-200 bg-white p-2 shadow-lg dark:border-slate-700 dark:bg-slate-900">
      @if (searchable()) {
        <input class="field mb-2" type="search" maxlength="60" [placeholder]="searchPlaceholder()" [value]="query()" (input)="onSearch($event)" />
      }
      <ul role="listbox" class="max-h-56 overflow-y-auto">
        @for (option of filtered(); track option.value) {
          <li>
            <button
              type="button"
              role="option"
              class="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
              [class.bg-brand-50]="option.value === value()"
              [class.dark:bg-slate-800]="option.value === value()"
              [attr.aria-selected]="option.value === value()"
              (click)="choose(option)"
            >
              @if (option.flagUrl) {
                <span class="select-flag" [style.background-image]="option.flagUrl"></span>
              }
              <span class="flex-1 truncate">{{ option.label }}</span>
            </button>
          </li>
        } @empty {
          <li class="px-2 py-2 text-sm text-slate-500 dark:text-slate-400">{{ emptyLabel() }}</li>
        }
      </ul>
    </div>
  }
</div>
